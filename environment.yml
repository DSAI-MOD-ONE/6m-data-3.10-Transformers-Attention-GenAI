name: dsai-m3
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scipy
  - statsmodels
  # Pinned: torch 2.14 crashes M1 Macs on half-precision attention
  # ("Failed to create function state object for: prefill_attention_mpp...").
  - pytorch=2.12.0
  - torchvision=0.27
  - jupyter
  - notebook
  - ipywidgets
  - pip:
      - transformers>=4.40
      - sentence-transformers>=3.0
      - datasets
      - textblob
